<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rioo Store</title>

<meta property="og:type" content="website">
<meta property="og:url" content="https://rioostore.vercel.app/">
<meta property="og:title" content="Nexo Pride">
<meta property="og:description" content="Nexo Pride || Road To Femes Cc">
<meta property="og:image" content="https://rioostore.vercel.app/logo.jpg">

<meta name="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="Nexo Pride">
<meta property="twitter:description" content="Nexo Pride || Road To Femes Cc">
<meta property="twitter:image" content="https://rioostore.vercel.app/logo.jpg">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:radial-gradient(circle at top,#111 0%,#000 60%);color:#fff;min-height:100vh;padding-top:20px;}

.navbar{position:sticky;top:0;z-index:50;padding:12px;}
.nav-container{max-width:1100px;margin:auto;background:rgba(20,20,20,.85);backdrop-filter:blur(12px);border-radius:18px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,.1);}
.nav-left{display:flex;align-items:center;gap:14px;}
.nav-logo{width:56px;height:56px;border-radius:14px;border:2px solid #25D366;object-fit:cover;}
.nav-title{font-size:24px;font-weight:900;}
.nav-right{display:flex;gap:14px;align-items:center;}
.nav-btn{padding:14px 28px;border-radius:14px;background:rgba(255,255,255,.06);color:#fff;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.15);}
.nav-btn:hover{background:#25D366;color:#000;}

.dot-btn{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);}

.hero-section{max-width:1100px;margin:30px auto 0;padding:0 20px;text-align:center;}
.section-title{font-size:40px;font-weight:900;margin-bottom:20px;display:flex;justify-content:center;gap:12px;align-items:center;}
.badge{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;background:linear-gradient(135deg,#7c3aed,#9333ea);}
.banner video{width:100%;height:400px;border-radius:22px;border:1px solid rgba(255,255,255,.1);object-fit:cover;}

.divider{width:80%;max-width:900px;margin:30px auto;height:2px;background:linear-gradient(to right,transparent,#666,transparent);border:none;}

.social-wrapper{display:flex;flex-direction:column;align-items:center;gap:18px;}
.social-top{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;}
.social-bottom{display:flex;justify-content:center;}
.social-btn{padding:14px 26px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#fff;text-decoration:none;font-weight:700;}
.social-btn:hover{background:#25D366;color:#000;}
.wa-btn{display:flex;align-items:center;gap:10px;}
.wa-img{width:22px;height:22px;}

.card-container{max-width:1000px;margin:auto;padding:0 20px;}
.card{background:rgba(255,255,255,.05);border-radius:18px;padding:22px;border:1px solid rgba(255,255,255,.1);margin-bottom:16px;}
.card-header{font-size:20px;font-weight:800;cursor:pointer;}
.card-sub{margin-top:6px;opacity:.75;font-size:14px;}
.card-content{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .4s ease;}
.card.active .card-content{max-height:600px;padding-top:16px;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s;z-index:998;}
.overlay.active{opacity:1;pointer-events:auto;}

.side-menu{position:fixed;top:0;right:-320px;width:300px;height:100vh;background:#0b0b0b;padding:20px;transition:.3s;z-index:999;}
.side-menu.active{right:0;}

.side-header{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;}
.close-btn{cursor:pointer;font-size:22px;}
.side-menu a{display:block;margin-top:20px;color:#fff;text-decoration:none;font-weight:700;}
footer{text-align:center;padding:40px 20px;opacity:.8;}

@media(max-width:640px){.section-title{font-size:32px;}.banner video{height:250px;}}

/* OVERLAY ENTER */
.enter-overlay{position:fixed;inset:0;backdrop-filter:blur(20px);background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;}
.enter-box{text-align:center;animation:fadeBlink 1.5s infinite;}
.enter-box h1{font-size:48px;font-weight:900;letter-spacing:4px;}
.enter-box p{opacity:.7;margin-top:10px;}
@keyframes fadeBlink{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>

<body id="top">

<div class="enter-overlay" id="enterOverlay">
  <div class="enter-box">
    <h1>PRESS ENTER</h1>
    <p>Tap Untuk Masuk</p>
  </div>
</div>

<nav class="navbar">
  <div class="nav-container">
    <div class="nav-left">
      <img src="logo.jpg" class="nav-logo">
      <div class="nav-title">Nexo</div>
    </div>
    <div class="nav-right">
      <a href="#top" class="nav-btn">Home</a>
      <div class="dot-btn" id="openMenu">⋮</div>
    </div>
  </div>
</nav>

<section class="hero-section">
  <h1 class="section-title">NEXO PRIDE <span class="badge">Official</span></h1>
  <div class="banner">
    <video id="bannerVideo" loop playsinline>
      <source src="banner.mp4" type="video/mp4">
    </video>
  </div>
</section>

<!-- ISI KAMU TETAP SAMA -->

<script>
document.querySelectorAll('.accordion').forEach(card=>{
  card.querySelector('.card-header').onclick=()=>{
    card.classList.toggle('active');
  }
});

const openMenu=document.getElementById('openMenu');
const closeMenu=document.getElementById('closeMenu');
const sideMenu=document.getElementById('sideMenu');
const overlay=document.getElementById('overlay');

openMenu.onclick=()=>{
  sideMenu.classList.add('active');
  overlay.classList.add('active');
}
function closeSide(){
  sideMenu.classList.remove('active');
  overlay.classList.remove('active');
}
closeMenu.onclick=closeSide;
overlay.onclick=closeSide;

/* SCRIPT ENTER */
const enterOverlay=document.getElementById("enterOverlay");
const video=document.getElementById("bannerVideo");

function startSite(){
  enterOverlay.style.display="none";
  video.muted=false;
  video.play();
}

document.addEventListener("keydown",e=>{
  if(e.key==="Enter") startSite();
});

enterOverlay.addEventListener("click",startSite);
</script>

</body>
</html>
